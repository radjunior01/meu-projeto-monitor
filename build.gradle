// build.gradle (ROOT PROJECT)

// 1. Configuração de onde o Gradle deve buscar os PLUGINS
pluginManagement {
    repositories {
        google()        // ESSENCIAL: Onde o plugin do Android reside
        mavenCentral()  // Repositório padrão de plugins
        gradlePluginPortal() 
    }
}

// 2. Configuração de onde o projeto deve buscar as BIBLIOTECAS
allprojects {
    repositories {
        google()        // ESSENCIAL: Onde as bibliotecas do Android residem
        mavenCentral()
    }
}

// 3. Definição dos plugins (sem aplicá-los na raiz)
plugins {
    id 'com.android.application' version '8.1.0' apply false
    id 'com.android.library' version '8.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.20' apply false
}

// 4. Task de limpeza
tasks.register('clean', Delete) {
    description = 'Deleta o diretório de build do projeto.'
    delete rootProject.buildDir
}
